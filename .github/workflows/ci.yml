name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven
          cache-dependency-path: pom.xml

      - name: Check repository whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- .

      - name: Test and package publication artifacts
        timeout-minutes: 15
        run: mvn -B -ntp clean verify -Dgpg.skip=true

      - name: Verify publication artifacts
        shell: bash
        run: |
          test -s target/atom-common.jar
          test -s target/atom-common-sources.jar
          test -s target/atom-common-javadoc.jar
