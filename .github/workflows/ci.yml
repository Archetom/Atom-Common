name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven
          cache-dependency-path: |
            .mvn/wrapper/maven-wrapper.properties
            pom.xml

      - name: Verify Maven wrapper pin
        shell: bash
        run: |
          expected="$(awk -F= '/^distributionUrl=/{value=$2; sub(/^.*apache-maven-/, "", value); sub(/-bin\.zip$/, "", value); print value}' .mvn/wrapper/maven-wrapper.properties)"
          actual="$(./mvnw --version | awk '/^Apache Maven /{print $3; exit}')"
          checksum="$(awk -F= '/^distributionSha256Sum=/{print $2}' .mvn/wrapper/maven-wrapper.properties)"
          test "$actual" = "$expected"
          test "${#checksum}" -eq 64
          case "$checksum" in
            *[!0-9a-f]*) exit 1 ;;
          esac

      - name: Check repository whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- .

      - name: Test and package publication artifacts
        timeout-minutes: 15
        run: ./mvnw -B -ntp clean verify -Dgpg.skip=true

      - name: Analyze dependencies
        timeout-minutes: 5
        run: ./mvnw -B -ntp test-compile dependency:analyze -DfailOnWarning=true

      - name: Verify publication artifacts
        shell: bash
        run: |
          test -s target/atom-common.jar
          test -s target/atom-common-sources.jar
          test -s target/atom-common-javadoc.jar
          jar tf target/atom-common-javadoc.jar | grep -q '^io/github/archetom/common/'
